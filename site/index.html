<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantinho do Café</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8ee;
      color: #333333;
      margin: 0;
      text-align: center;
    }
    header {
      background-color: #6b3e26;
      color: #ffffff;
      padding: 40px 20px;
    }
    h1 {
      margin: 0 0 10px;
    }
    main {
      padding: 30px 20px;
    }
    h2 {
      color: #6b3e26;
    }
    ul {
      list-style: none;
      padding: 0;
      font-size: 18px;
    }
    li {
      margin: 12px 0;
    }
    footer {
      background-color: #6b3e26;
      color: #ffffff;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cantinho do Café</h1>
    <p>Uma cafeteria de bairro para tomar um café com calma.</p>
  </header>

  <main>
    <h2>O que oferecemos</h2>
    <ul>
      <li><strong>Cafés:</strong> espresso, coado e cappuccino</li>
      <li><strong>Doces:</strong> bolos e tortas caseiras</li>
      <li><strong>Ambiente:</strong> tranquilo, com Wi-Fi grátis</li>
    </ul>
  </main>

  <footer>
    Feito por Fellipe Zucareli | Informática para Internet | ETEC Rodrigues de Abreu
  </footer>
</body>
</html>
